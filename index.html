<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achei Barato - Ofertas do dia</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --txt:#1a1a1a; --mut:#666; --btn:#e8590c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --card:#1e1e1e; --txt:#f2f2f2; --mut:#aaa; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:20px 16px 8px; text-align:center; }
  h1 { margin:0; font-size:1.5rem; }
  header p { margin:4px 0 0; color:var(--mut); font-size:.9rem; }
  main { max-width:600px; margin:0 auto; padding:12px 16px 40px; display:grid; gap:12px; }
  .card { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .card h2 { margin:0 0 6px; font-size:1rem; }
  .price { font-size:1.4rem; font-weight:700; }
  .old { color:var(--mut); text-decoration:line-through; font-size:.85rem; margin-left:8px; }
  .store { color:var(--mut); font-size:.8rem; margin:4px 0 10px; }
  a.btn { display:block; text-align:center; background:var(--btn); color:#fff; padding:12px; border-radius:8px; text-decoration:none; font-weight:600; }
  footer { text-align:center; color:var(--mut); font-size:.75rem; padding:0 16px 24px; }
</style>
</head>
<body>
<header>
  <h1>Achei Barato</h1>
  <p>As melhores ofertas, atualizadas todo dia</p>
</header>
<main id="lista"><p>Carregando ofertas...</p></main>
<footer>Como afiliado, posso receber comissão por compras feitas pelos links, sem custo extra para você. Preços podem mudar.</footer>
<script>
  fetch('deals.json')
    .then(function (r) { return r.json(); })
    .then(function (deals) {
      var el = document.getElementById('lista');
      el.innerHTML = '';
      deals.forEach(function (d) {
        var card = document.createElement('div');
        card.className = 'card';
        var old = d.precoAntigo ? '<span class="old">R$ ' + d.precoAntigo + '</span>' : '';
        card.innerHTML =
          '<h2>' + d.nome + '</h2>' +
          '<div><span class="price">R$ ' + d.preco + '</span>' + old + '</div>' +
          '<div class="store">' + d.loja + '</div>' +
          '<a class="btn" href="' + d.link + '" target="_blank" rel="nofollow sponsored noopener">Ver oferta</a>';
        el.appendChild(card);
      });
    })
    .catch(function () {
      document.getElementById('lista').innerHTML = '<p>Não foi possível carregar as ofertas.</p>';
    });
</script>
</body>
</html>
